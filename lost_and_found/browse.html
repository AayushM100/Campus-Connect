    <title>

    <link rel="stylesheet" href="../Main/tokens.css">
    <script>
      (function() {
        var t = localStorage.getItem('campusConnectTheme') || localStorage.getItem('campusBitesTheme') || (localStorage.getItem('darkMode') === 'true' ? 'dark' : null) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          if (document.body) document.body.classList.add('dark-mode');
          else document.addEventListener('DOMContentLoaded', function() { document.body.classList.add('dark-mode'); });
        }
      })();
    </script>
    <link
        rel="stylesheet"
        href="lost.css"
    >

    <style>

        .browse-results {
            margin-top: 50px;
        }

        .browse-message {
            text-align: center;
            padding: 60px 20px;
            color: #71819a;
        }

        .browse-message h3 {
            color: #14213d;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .browse-card {
            overflow: hidden;
        }

        .browse-card .item-image {
            min-height: 260px;
        }

        .browse-card .item-image img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .details-btn {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #14213d;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .details-btn:hover {
            background: #c85a00;
        }

        .details-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #f7f8fa;
            display: none;
        }

        .details-box.show {
            display: block;
        }

        .details-box p {
            margin: 7px 0;
        }

    </style>

</head>

    <!-- ================= BROWSE PAGE ================= -->

        <!-- ================= SEARCH ================= -->

    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const statusFilter =

        const searchButton =

            );



        // =====================================================

            "chem": "/lost_and_found/uploads/items/chem.jpg",

            "chemistry book": "/lost_and_found/uploads/items/chem.jpg",
            "chemistry lab journal": "/lost_and_found/uploads/items/chem.jpg",
            "lab file": "/lost_and_found/uploads/items/yellowfile.jpg",
            "labfile": "/lost_and_found/uploads/items/yellowfile.jpg",
            "lab": "/lost_and_found/uploads/items/yellowfile.jpg",
            "yellow file": "/lost_and_found/uploads/items/yellowfile.jpg",
            "yellowfile": "/lost_and_found/uploads/items/yellowfile.jpg",
            "file": "/lost_and_found/uploads/items/yellowfile.jpg",
            "ipad": "/lost_and_found/uploads/items/ipad.jpg",
            "i pad": "/lost_and_found/uploads/items/ipad.jpg",
            "apple ipad": "/lost_and_found/uploads/items/ipad.jpg",
            "tablet": "/lost_and_found/uploads/items/ipad.jpg"
        };


        // =====================================================
        // TIMESTAMP & DATE HELPERS
        // =====================================================

        function getItemTimestamp(item) {
            if (item.created_at) {
                const t = new Date(item.created_at).getTime();
                if (!isNaN(t) && t > 0) return t;
            }
            if (item.image) {
                const match = String(item.image).match(/_(\d{10,13})/);
                if (match) {
                    const num = parseInt(match[1], 10);
                    return match[1].length === 10 ? num * 1000 : num;
                }
            }
            return 1790000000000 + ((Number(item.serial_number) || 0) * 3600000);
        }

        function formatItemDate(item) {
            const ts = getItemTimestamp(item);
            if (!ts) return "Recently";
            const date = new Date(ts);
            const now = new Date();
            const diffHours = Math.round((now - date) / (1000 * 60 * 60));
            if (diffHours >= 0 && diffHours < 24) return "Today";
            if (diffHours >= 24 && diffHours < 48) return "Yesterday";
            return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        }


        // =====================================================
        // RESOLVE ITEM IMAGE URL
        // =====================================================

        function getDictionaryFallback(itemName) {
            if (!itemName) return "";
            const key = String(itemName).trim().toLowerCase();
            if (imageMap[key]) return imageMap[key];
            const norm = key.replace(/[^a-z0-9]/g, " ").replace(/\s+/g, " ").trim();
            if (imageMap[norm]) return imageMap[norm];
            for (const [mapKey, path] of Object.entries(imageMap)) {
                if ((key.length > 2 && mapKey.includes(key)) || (mapKey.length > 2 && key.includes(mapKey))) {
                    return path;
                }
            }
            return "";
        }

        function resolveItemImageUrl(image, itemName) {
            let imageValue = image ? String(image).trim() : "";

            if (imageValue.startsWith("data:") || imageValue.startsWith("http://") || imageValue.startsWith("https://")) {
                return imageValue;
            }

            if (imageValue !== "") {
                const cleanPath = imageValue.replace(/\\/g, "/").replace(/^\/+/, "");
                if (cleanPath.startsWith("lost_and_found/")) {
                    return "/" + cleanPath;
                }
                if (cleanPath.startsWith("uploads/")) {
                    return "/lost_and_found/" + cleanPath;
                }
                return "/lost_and_found/uploads/items/" + cleanPath.split("/").pop();
            }

            return getDictionaryFallback(itemName);
        }

        function handleItemImageError(imgEl, itemName) {
            if (imgEl.getAttribute("data-fallback-tried") === "backend") {
                imgEl.setAttribute("data-fallback-tried", "dict");
                const dictFallback = getDictionaryFallback(itemName);
                if (dictFallback && !imgEl.src.includes(dictFallback)) {
                    imgEl.src = dictFallback;
                    return;
                }
                showFallbackIcon(imgEl);
                return;
            }

            if (!imgEl.getAttribute("data-fallback-tried")) {
                imgEl.setAttribute("data-fallback-tried", "backend");
                const filename = (imgEl.src || "").split("/").pop().split("?")[0];
                if (filename && !imgEl.src.includes("campus-connect-4n2t.onrender.com")) {
                    imgEl.src = "https://campus-connect-4n2t.onrender.com/uploads/items/" + filename;
                    return;
                }
                const dictFallback = getDictionaryFallback(itemName);
                if (dictFallback && !imgEl.src.includes(dictFallback)) {
                    imgEl.setAttribute("data-fallback-tried", "dict");
                    imgEl.src = dictFallback;
                    return;
                }
            }

            showFallbackIcon(imgEl);
        }

        function showFallbackIcon(imgEl) {
            imgEl.style.display = "none";
            const parent = imgEl.parentElement;
            if (parent && !parent.querySelector(".image-fallback")) {
                parent.innerHTML = '<div style="height:260px;display:flex;align-items:center;justify-content:center;font-size:70px;">📦</div>';
            }
        }



        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHTML(value) {

            return String(value || "")

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // =====================================================
        // LOAD BOTH LOST + FOUND ITEMS
        // =====================================================

        async function loadItems() {


            try {


                const lostResponse =
                    await fetch(
                        API_BASE + "/lost"
                    );


                const foundResponse =
                    await fetch(
                        API_BASE + "/found"
                    );


                if (
                    !lostResponse.ok ||
                    !foundResponse.ok
                ) {

                    throw new Error(
                        "Could not load items."
                    );

                }



                const lostItems =
                    await lostResponse.json();


                const foundItems =
                    await foundResponse.json();



                const allLost =
                    Array.isArray(lostItems)
                        ? lostItems
                        : [];


                const allFound =
                    Array.isArray(foundItems)
                        ? foundItems
                        : [];



                // -------------------------------------------------
                // ADD STATUS
                // -------------------------------------------------

                const lost =
                    allLost.map(
                        function(item) {

                            return {

                                ...item,

                                status: "lost"

                            };

                        }
                    );


                const found =
                    allFound.map(
                        function(item) {

                            return {

                                ...item,

                                status: "found"

                            };

                        }
                    );



                // -------------------------------------------------
                // COMBINE
                // -------------------------------------------------

                const allItems =
                    [
                        ...lost,
                        ...found
                    ];

                allItems.sort(function(a, b) {
                    return getItemTimestamp(b) - getItemTimestamp(a);
                });



                // -------------------------------------------------
                // STORE GLOBALLY
                // -------------------------------------------------

                window.allBrowseItems =
                    allItems;



                // -------------------------------------------------
                // CHECK FOR SAVED SEARCH
                // -------------------------------------------------

                const savedSearch =
                    sessionStorage.getItem(
                        "browseSearch"
                    );


                if (
                    savedSearch
                ) {

                    searchInput.value =
                        savedSearch;


                    sessionStorage.removeItem(
                        "browseSearch"
                    );


                    searchItems();

                }
                else {

                    displayItems(
                        allItems
                    );

                }


            }
            catch (error) {


                console.error(
                    "Browse error:",
                    error
                );


                resultsContainer.innerHTML = `

                    <div class="browse-message">

                        <h3>
                            Unable to load items
                        </h3>

                        <p>
                            Make sure the Express server
                            is currently unavailable. Please try again in a moment.
                        </p>

                    </div>

                `;

            }

        }



        // =====================================================
        // SEARCH ITEMS
        // =====================================================

        function searchItems() {


            const searchValue =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const selectedStatus =
                statusFilter.value;


            let filtered =
                window.allBrowseItems || [];



            // -------------------------------------------------
            // SEARCH TEXT
            // -------------------------------------------------

            if (
                searchValue !== ""
            ) {

                filtered =
                    filtered.filter(
                        function(item) {


                            const name =
                                String(
                                    item.item_name || ""
                                )
                                .toLowerCase();


                            const description =
                                String(
                                    item.description || ""
                                )
                                .toLowerCase();


                            const location =
                                String(
                                    item.location || ""
                                )
                                .toLowerCase();


                            return (

                                name.includes(
                                    searchValue
                                )

                                ||

                                description.includes(
                                    searchValue
                                )

                                ||

                                location.includes(
                                    searchValue
                                )

                            );

                        }
                    );

            }



            // -------------------------------------------------
            // LOST / FOUND FILTER
            // -------------------------------------------------

            if (
                selectedStatus !== "all"
            ) {

                filtered =
                    filtered.filter(
                        function(item) {

                            return (

                                String(
                                    item.status || ""
                                )
                                .toLowerCase() ===
                                selectedStatus

                            );

                        }
                    );

            }



            displayItems(
                filtered
            );

        }



        // =====================================================
        // DISPLAY ITEMS
        // =====================================================

        function displayItems(items) {


            resultsContainer.innerHTML =
                "";



            if (
                !Array.isArray(items) ||
                items.length === 0
            ) {

                resultsContainer.innerHTML = `

                    <div class="browse-message">

                        <h3>
                            No matching item found.
                        </h3>

                        <p>
                            Try another item name,
                            location or description.
                        </p>

                    </div>

                `;

                return;

            }



            // =================================================
            // CREATE CARDS
            // =================================================

            items.forEach(
                function(item) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "item-card browse-card";



                    const status =
                        String(
                            item.status || ""
                        )
                        .toLowerCase();


                    const statusText =
                        status === "found"
                            ? "FOUND"
                            : "LOST";


                    const statusClass =
                        status === "found"
                            ? "found"
                            : "lost";



                    const itemName =
                        item.item_name ||
                        "Unknown Item";


                    const description =
                        item.description ||
                        "No description available.";


                    const location =
                        item.location ||
                        "Unknown location";


                    const personName =
                        item.person_name ||
                        "Not available";


                    const contact =
                        item.contact_number ||
                        "Not available";


                    const rollNumber =
                        item.roll_number ||
                        "Not available";



                    // =================================================
                    // IMAGE
                    // =================================================

                    const imageUrl =
                        resolveItemImageUrl(item.image, itemName);

                    let imageHTML;

                    if (
                        imageUrl !== ""
                    ) {
                        imageHTML = `
                            <img
                                src="${escapeHTML(imageUrl)}"
                                alt="${escapeHTML(itemName)}"
                                class="browse-item-image"
                                onerror="handleItemImageError(this, '${escapeHTML(itemName)}')"
                            >
                        `;
                    }
                    else {
                        imageHTML = `
                            <div
                                style="
                                    height:260px;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-size:70px;
                                "
                            >
                                📦
                            </div>
                        `;
                    }



                    // =================================================
                    // CARD HTML
                    // =================================================

                    card.innerHTML = `

                        <div
                            class="item-image ${
                                status === "found"
                                    ? "orange-image"
                                    : "blue-image"
                            }"
                        >

                            ${imageHTML}

                        </div>



                        <div class="item-content">


                            <div class="item-top">

                                <span
                                    class="status ${statusClass}"
                                >

                                    ${statusText}

                                </span>


                                <span class="date">

                                    ${formatItemDate(item)}

                                </span>

                            </div>



                            <h3>

                                ${escapeHTML(itemName)}

                            </h3>



                            <p>

                                ${escapeHTML(description)}

                            </p>



                            <div class="item-location">

                                📍

                                ${escapeHTML(location)}

                            </div>



                            <button
                                class="details-btn"
                                type="button"
                            >

                                View Details

                            </button>



                            <div
                                class="details-box"
                            >

                                <p>

                                    <strong>
                                        Status:
                                    </strong>

                                    ${statusText}

                                </p>


                                <p>

                                    <strong>
                                        Location:
                                    </strong>

                                    ${escapeHTML(location)}

                                </p>


                                <p>

                                    <strong>
                                        Description:
                                    </strong>

                                    ${escapeHTML(description)}

                                </p>


                                <p>

                                    <strong>
                                        Name:
                                    </strong>

                                    ${escapeHTML(personName)}

                                </p>


                                <p>

                                    <strong>
                                        Roll Number:
                                    </strong>

                                    ${escapeHTML(rollNumber)}

                                </p>


                                <p>

                                    <strong>
                                        Contact:
                                    </strong>

                                    ${escapeHTML(contact)}

                                </p>

                            </div>


                        </div>

                    `;



                    // =================================================
                    // VIEW DETAILS BUTTON
                    // =================================================

                    const detailsButton =
                        card.querySelector(
                            ".details-btn"
                        );


                    const detailsBox =
                        card.querySelector(
                            ".details-box"
                        );


                    detailsButton.addEventListener(
                        "click",
                        function() {


                            detailsBox.classList.toggle(
                                "show"
                            );


                            if (
                                detailsBox.classList.contains(
                                    "show"
                                )
                            ) {

                                detailsButton.textContent =
                                    "Hide Details";

                            }
                            else {

                                detailsButton.textContent =
                                    "View Details";

                            }

                        }
                    );



                    resultsContainer.appendChild(
                        card
                    );

                }
            );

        }



        // =====================================================
        // SEARCH BUTTON
        // =====================================================

        searchButton.addEventListener(
            "click",
            function() {

                searchItems();

            }
        );



        // =====================================================
        // ENTER KEY
        // =====================================================

        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    searchItems();

                }

            }
        );



        // =====================================================
        // FILTER CHANGE
        // =====================================================

        statusFilter.addEventListener(
            "change",
            function() {

                searchItems();

            }
        );



        // =====================================================
        // START
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadItems();

            }
        );


    </script>
