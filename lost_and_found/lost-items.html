            "tablet": "/lost_and_found/uploads/items/ipad.jpg"
        };


        // =====================================================
        // TIMESTAMP & DATE HELPERS
        // =====================================================

        function getItemTimestamp(item) {
            if (item.created_at) {
                const t = new Date(item.created_at).getTime();
                if (!isNaN(t) && t > 0) return t;
            }
            if (item.image) {
                const match = String(item.image).match(/_(\d{10,13})/);
                if (match) {
                    const num = parseInt(match[1], 10);
                    return match[1].length === 10 ? num * 1000 : num;
                }
            }
            const serial = Number(item.serial_number) || 0;
            if (serial >= 25) {
                return 1792900000000 + (serial * 60000);
            }
            return 1790000000000 + (serial * 3600000);
        }

        function formatItemDate(item) {
            const ts = getItemTimestamp(item);
            if (!ts) return "Recently";
            const date = new Date(ts);
            const now = new Date();
            const diffHours = Math.round((now - date) / (1000 * 60 * 60));
            if (diffHours >= 0 && diffHours < 24) return "Today";
            if (diffHours >= 24 && diffHours < 48) return "Yesterday";
            return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        }


        // =====================================================
        // RESOLVE ITEM IMAGE URL
        // =====================================================

        function getDictionaryFallback(itemName) {
            if (!itemName) return "";
            const key = String(itemName).trim().toLowerCase();
            if (imageMap[key]) return imageMap[key];
            const norm = key.replace(/[^a-z0-9]/g, " ").replace(/\s+/g, " ").trim();
            if (imageMap[norm]) return imageMap[norm];
            for (const [mapKey, path] of Object.entries(imageMap)) {
                if ((key.length > 2 && mapKey.includes(key)) || (mapKey.length > 2 && key.includes(mapKey))) {
                    return path;
                }
            }
            return "";
        }

        function resolveItemImageUrl(image, itemName) {
            let imageValue = image ? String(image).trim() : "";

            if (imageValue.startsWith("data:") || imageValue.startsWith("http://") || imageValue.startsWith("https://")) {
                return imageValue;
            }

            if (imageValue !== "") {
                const cleanPath = imageValue.replace(/\\/g, "/").replace(/^\/+/, "");
                if (cleanPath.startsWith("lost_and_found/")) {
                    return "/" + cleanPath;
                }
                if (cleanPath.startsWith("uploads/")) {
                    return "/lost_and_found/" + cleanPath;
                }
                return "/lost_and_found/uploads/items/" + cleanPath.split("/").pop();
            }

            return getDictionaryFallback(itemName);
        }

        function handleItemImageError(imgEl, itemName) {
            console.warn("[Lost & Found] Image load failure:", imgEl.src, "for item:", itemName);

            if (imgEl.getAttribute("data-fallback-tried") === "backend") {
                imgEl.setAttribute("data-fallback-tried", "dict");
                const dictFallback = getDictionaryFallback(itemName);
                if (dictFallback && !imgEl.src.includes(dictFallback)) {
                    imgEl.src = dictFallback;
                    return;
                }
                showFallbackIcon(imgEl, itemName);
                return;
            }

            if (!imgEl.getAttribute("data-fallback-tried")) {
                imgEl.setAttribute("data-fallback-tried", "backend");
                const filename = (imgEl.src || "").split("/").pop().split("?")[0];
                if (filename && !imgEl.src.includes("campus-connect-4n2t.onrender.com")) {
                    imgEl.src = "https://campus-connect-4n2t.onrender.com/uploads/items/" + filename;
                    return;
                }
                const dictFallback = getDictionaryFallback(itemName);
                if (dictFallback && !imgEl.src.includes(dictFallback)) {
                    imgEl.setAttribute("data-fallback-tried", "dict");
                    imgEl.src = dictFallback;
                    return;
                }
            }

            showFallbackIcon(imgEl, itemName);
        }

        function showFallbackIcon(imgEl, itemName) {
            imgEl.style.display = "none";
            const parent = imgEl.parentElement;
            if (parent && !parent.querySelector(".image-fallback-container")) {
                const fallback = document.createElement("div");
                fallback.className = "image-fallback-container";
                fallback.innerHTML = `
                    <div class="fallback-icon-badge">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </div>
                    <span class="fallback-text">Photo not available</span>
                `;
                parent.appendChild(fallback);
            }
        }


        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // =====================================================
        // CREATE CARD
        // =====================================================

        function createCard(item) {

            const itemName = item.item_name || "Unknown Item";
            const description = item.description || "No description provided.";
            const location = item.location || "Location not specified";
            const status = item.status || "lost";
            const imageUrl = resolveItemImageUrl(item.image, itemName);

            let imageHTML;
            if (imageUrl) {
                imageHTML = `
                    <img
                        src="${escapeHTML(imageUrl)}"
                        alt="${escapeHTML(itemName)}"
                        class="lost-item-image"
                        onerror="handleItemImageError(this, '${escapeHTML(itemName)}')"
                    >
                `;
            } else {
                imageHTML = `
                    <div class="image-fallback-container">
                        <div class="fallback-icon-badge">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </div>
                        <span class="fallback-text">Photo not available</span>
                    </div>
                `;
            }

            const card = document.createElement("div");
            card.className = "item-card";
            card.setAttribute("data-status", String(status).toLowerCase());

            card.innerHTML = `
                <div class="item-image blue-image">
                    ${imageHTML}
                </div>

                <div class="item-content">
                    <div class="item-top">
                        <span class="status lost">
                            LOST
                        </span>
                        <span class="date">
                            ${formatItemDate(item)}
                        </span>
                    </div>

                    <h3>
                        ${escapeHTML(itemName)}
                    </h3>

                    <p>
                        ${escapeHTML(description)}
                    </p>

                    <div class="item-location">
                        📍 ${escapeHTML(location)}
                    </div>
                </div>
            `;

            return card;

        }


        // =====================================================
        // FILTER & COUNT HELPERS
        // =====================================================

        const filterInput = document.getElementById("filterInput");
        const itemCountBadge = document.getElementById("itemCountBadge");

        function updateItemCount(count) {
            if (itemCountBadge) {
                itemCountBadge.textContent = `Showing ${count} item${count === 1 ? '' : 's'}`;
            }
        }

        function renderLostCards(itemsList) {
            lostItemsGrid.innerHTML = "";

            if (!Array.isArray(itemsList) || itemsList.length === 0) {
                lostItemsGrid.innerHTML = `
                    <div class="no-items">
                        <h3>No matching lost items.</h3>
                        <p>Try refining your search keyword or check found items.</p>
                    </div>
                `;
                return;
            }

            itemsList.forEach(function(item) {
                const card = createCard(item);
                lostItemsGrid.appendChild(card);
            });
        }

        if (filterInput) {
            filterInput.addEventListener("input", function() {
                const query = this.value.trim().toLowerCase();
                const items = window.allLostItems || [];

                if (!query) {
                    renderLostCards(items);
                    updateItemCount(items.length);
                    return;
                }

                const filtered = items.filter(item => {
                    const name = String(item.item_name || "").toLowerCase();
                    const desc = String(item.description || "").toLowerCase();
                    const loc = String(item.location || "").toLowerCase();
                    return name.includes(query) || desc.includes(query) || loc.includes(query);
                });

                renderLostCards(filtered);
                updateItemCount(filtered.length);
            });
        }


        // =====================================================
        // LOAD LOST ITEMS
        // =====================================================

        async function loadLostItems() {

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("HTTP Error: " + response.status);
                }

                const items = await response.json();

                console.log("ITEMS FROM DATABASE:", items);

                if (!Array.isArray(items) || items.length === 0) {
                    window.allLostItems = [];
                    renderLostCards([]);
                    updateItemCount(0);
                    return;
                }

                // Deterministic sort: newest first
                items.sort((a, b) => getItemTimestamp(b) - getItemTimestamp(a));
                window.allLostItems = items;

                renderLostCards(items);
                updateItemCount(items.length);

            }

            catch (error) {

                console.error("ERROR:", error);

                lostItemsGrid.innerHTML = `
                    <div class="no-items">
                        <h3>Could not load lost items.</h3>
                        <p>Please make sure the Express server is running.</p>
                    </div>
                `;

                if (itemCountBadge) {
                    itemCountBadge.textContent = "Offline";
                }

            }

        }



        // =====================================================
        // START
        // =====================================================

        loadLostItems();


    </script>
